<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>爱 · 金红渐变枫叶</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/p5.min.js"></script>
  <script defer src="tree-data.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="moon-map.js"></script>
  <script defer src="glitter.js"></script>
  <script defer src="scene.js"></script>
</head>
<body data-look="maple-blend">
  <main class="work" aria-label="花落成蝶">
    <section class="painting" aria-label="三比四主场景">
    <div id="landscape" role="img" aria-label="纯黑夜空里，树长出金红渐变枫叶，不开花。月牙、星星和小树叶向左飘落后化蝶，部分停在途中变成星星，其余飞入右上方月亮，推动月牙逐渐变为圆月。"></div>
    </section>
    <div class="controls">
      <div class="timeline">
        <button id="play" type="button" class="icon-button" aria-label="播放" data-state="paused" disabled>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 19 12 8 18.5Z" fill="currentColor"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
        <button id="replay" type="button" class="icon-button" aria-label="重播" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7.5 7.5 0 1 1-.3 5M5 4.5V9h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <input id="progress" type="range" min="0" max="2400" value="0" step="1" aria-label="动画进度" disabled>
        <!-- LOCAL_SPEED_START -->
        <button id="speed" class="speed-button" type="button" aria-label="播放速度 1 倍，点击切换">1×</button>
        <!-- LOCAL_SPEED_END -->
        <output id="time" for="progress">0.00 / 24.00 秒</output>
      </div>
    </div>
    <nav class="looks" aria-label="三版效果对比">
      <a href="index.html">纯金叶</a>
      <a href="flowers.html">金花更盛</a>
      <a href="maple-blend.html" aria-current="page">金红渐变枫叶</a>
    </nav>
    <p id="status" class="sr-only" role="status" aria-live="polite">画面正在准备。</p>
  </main>
  <noscript>请开启 JavaScript，观看花落成蝶。</noscript>
</body>
</html>
